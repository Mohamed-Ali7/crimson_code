<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>


  <link rel="stylesheet" href="../static/styles/login.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>

  <header class="navbar">
    <div class="logo">
      <img src="../static/images/crimson_code_logo.png">
    </div>
    <div class="home-btn">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </div>
  </header>
  <main class="login-wrapper">
    <section class="login-card">
      <h1>Welcome Back</h1>
      <p>Log in to continue your journey</p>
      <form class="login-form">
        <div class="form-group">
          <i class="fas fa-envelope"></i>
          <input type="text" class="form-input email-input" placeholder="Email">
        </div>
        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-input password-input" placeholder="Password">
          <i class="bi bi-eye-slash" id="togglePassword"></i>
        </div>
        <div class="error-message" id="login-error">Invalid email or password.</div>
        <button type="submit" class="login-btn">Login</button>
        <div class="login-links">
          <a href="#">Forgot Password?</a>
          <span> | </span>
          <a href="#">Sign Up</a>
          <a href="#" class="verification-link">Verify Your Email</a>
        </div>
      </form>
    </section>
  </main>
</body>
<script src="../static/scripts/login.js"></script>
</html>
