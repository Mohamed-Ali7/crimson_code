<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification Request</title>


  <link rel="stylesheet" href="../static/styles/verification_request.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>

  <header class="navbar">
    <div class="logo">
      <img src="../static/images/crimson_code_logo.png">
    </div>
    <div class="home-btn">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </div>
  </header>
  <main class="verification-request-wrapper">
    <section class="verification-request-card">
      <h1>Verify your email</h1>
      <form class="verification-request-form">
        <div class="form-group">
          <i class="fas fa-envelope"></i>
          <input type="text" class="form-input email-input" placeholder="Email">
        </div>
        <div class="error-message">Invalid</div>
        <button type="submit" class="verification-request-btn">send a verification mail</button>
        <div class="verification-request-links">
          <a href="login.html">Back</a>
        </div>
      </form>
    </section>
  </main>
</body>
<script src="../static/scripts/verification_request.js"></script>

</html>
