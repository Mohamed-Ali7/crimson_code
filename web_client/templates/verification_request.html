<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification Request</title>


  <link rel="stylesheet" href="../static/styles/common.css" />
  <link rel="stylesheet" href="../static/styles/verification_request.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@2/src/js.cookie.min.js"></script>

</head>

<body>

  <header class="navbar">
    <div class="logo">
      <img src="../static/images/crimson_code_logo.png">
    </div>

      <i class="fas fa-bars menu-bar"></i>

      <div class="navbar-buttons">
        <ul class="nav-left-buttons">
          <li class="home-btn">
            <i class="fas fa-home"></i>
            Home
          </li>

          <li class="categories-btn">

            <div class="category-details">
              <i class="fas fa-layer-group"></i>
              <span>Categories</span>
            </div>

            <ul class="category-dropdown">
              
            </ul>
          </li>
        </ul>

        <div class="mobile-view-search-btn">
          <i class="fas fa-search"></i></i>
          Search
        </div>

        <div class="mobile-view-logout-btn">
          <i class="fas fa-sign-out-alt fa-flip-horizontal"></i>
          Logout
        </div>

        <div class="search-container">

          <div class="tag-dropdown">
            <button id="tag-dropdown-btn">Tags <i class="bi bi-caret-down-fill"></i></button>
            <div class="tag-dropdown-content">
              <input type="text" class="tag-search" placeholder="Search tags..." />
              <div class="tag-checkboxes">

              </div>
            </div>
          </div>

          <input class="main-search-input" type="search" placeholder="Search..." />
          <i class="fas fa-search"></i>
        </div>

        <ul class="nav-right-buttons">
          <li class="login-signup-btn">
            <button class="navbar-login-btn">
              <i class="fas fa-sign-in-alt"></i>
              Login
            </button>

            <button class="navbar-signup-btn">
              <i class="bi bi-person-plus-fill"></i>
              Sign Up
            </button>
          </li>

        </ul>
        <ul class="user-profile">
          <li class="profile-details">
            <div class="profile-pic">
              <img src="" alt="" />
            </div>
            <span class="user-name"></span>
          </li>
          <li class="profile-dropdown">
            <button class="view-profile">View Profile</button>
            <button class="logout-btn">Logout</button>
          </li>
        </ul>
      </div>
  </header>
  
  <main class="verification-request-wrapper">
    <section class="verification-request-card">
      <h1>Verify your email</h1>
      <form class="verification-request-form">
        <div class="form-group">
          <i class="fas fa-envelope"></i>
          <input type="text" class="form-input email-input" placeholder="Email">
        </div>
        <div class="error-message">Invalid</div>
        <button type="submit" class="verification-request-btn">send a verification mail</button>
        <div class="verification-request-links">
          <a href="login.html">Back</a>
        </div>
      </form>
    </section>
  </main>
</body>
<script src="../static/scripts/common.js"></script>
<script src="../static/scripts/verification_request.js"></script>

</html>
