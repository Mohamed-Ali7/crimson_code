<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up</title>


  <link rel="stylesheet" href="../static/styles/sign_up.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>

  <header class="navbar">
    <div class="logo">
      <img src="../static/images/crimson_code_logo.png">
    </div>
    <div class="home-btn">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </div>
  </header>
  <main class="sign-up-wrapper">
    <section class="sign-up-card">
      <h1>Welcome to <span>Crimson</span> Code</h1>
      <p>Create your account to join our community of tech enthusiasts.</p>
      <form class="sign-up-form">
        <div class="form-group">
          <i class="fas fa-envelope"></i>
          <input type="text" class="form-input email-input" placeholder="Email">
        </div>
        <div class="error-message">Invalid</div>
        
        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-input password-input" placeholder="Password">
          <i class="bi bi-eye-slash" id="togglePassword"></i>
        </div>
        <div class="error-message">Invalid</div>

        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-input confirm-password-input" placeholder="Confirm Password">
          <i class="bi bi-eye-slash" id="togglePassword"></i>
        </div>
        <div class="error-message">Invalid</div>
        
        <div class="form-group">
          <i class="fas fa-user"></i>
          <input type="text" class="form-input first-name-input" placeholder="First Name">
        </div>
        <div class="error-message">Invalid</div>

        <div class="form-group">
          <i class="fas fa-user"></i>
          <input type="text" class="form-input last-name-input" placeholder="Last Name">
        </div>
        <div class="error-message">Invalid</div>

        <button type="submit" class="sign-up-btn">Sign up</button>
        <div class="sign-up-links">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </form>
    </section>
  </main>
</body>
<script src="../static/scripts/sign_up.js"></script>
</html>
