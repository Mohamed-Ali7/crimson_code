<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset</title>


  <link rel="stylesheet" href="../static/styles/password_reset.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Roboto&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>

  <header class="navbar">
    <div class="logo">
      <img src="../static/images/crimson_code_logo.png">
    </div>
    <div class="home-btn">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </div>
  </header>
  <main class="password-reset-wrapper">
    <div class="error-message-container">
      <div class="password-reset-error-message">
        <h1>Invalid or Expired Link</h1>
        <p>The link you’ve used is either invalid or has expired. Please request a new password reset link.</p>
      </div>
    </div>
    <button class="requset-new-rest-link-btn btn">Request New Reset Link</button>
    <section class="password-reset-card">
      <h1>Reset Your Password</h1>
      <form class="password-reset-form">

        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-input new-password-input" placeholder="Password">
          <i class="bi bi-eye-slash" id="togglePassword"></i>
        </div>
        <div class="error-message">Invalid</div>

        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" class="form-input confirm-password-input" placeholder="Confirm Password">
          <i class="bi bi-eye-slash" id="togglePassword"></i>
        </div>
        <div class="error-message">Invalid</div>


        <button type="submit" class="password-reset-btn btn">Reset Password</button>
        <div class="password-reset-links">
          <a href="login.html">Back</a>
        </div>
      </form>
    </section>
  </main>
</body>
<script src="../static/scripts/password_reset.js"></script>

</html>
